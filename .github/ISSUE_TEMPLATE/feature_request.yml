name: Feature request
description: Suggest an improvement of the Symfony integration
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to achieve, and what is missing today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: How should the bundle support it? Configuration, services, commands...
    validations:
      required: true
